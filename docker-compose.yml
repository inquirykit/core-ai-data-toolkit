services:
  core-ai-data-toolkit:
    build:
      context: .
      args:
        JOB_ENVS: ${JOB_ENVS:-}   # e.g. JOB_ENVS=autogluon for the AutoGluon jobs
    ports:
      - "8000:8000"
    environment:
      # Empty unless set on the host, so limits saved from /admin persist.
      - MAX_MODELS=${MAX_MODELS:-}
      - MAX_MEMORY_GB=${MAX_MEMORY_GB:-}
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
    volumes:
      - hf-cache:/app/.cache/huggingface   # persisted model weights
      - ./data/images:/app/data/images:ro,Z  # images for /vision-language (Z: SELinux label, a no-op elsewhere)
      - config:/app/data/config            # settings written by /admin/setup
      - collections:/app/data/arcadedb     # everything stored: /collections, /db, traces, jobs, metrics (embedded ArcadeDB)
      - jobs:/app/data/jobs                # job files: logs and trained predictors
      - datasets:/app/data/datasets        # job input files (POST /jobs/data)
      - enrichers:/app/data/enrichers      # your enrichers
      - evidence:/app/data/evidence        # evidence captures and their signing key
    restart: unless-stopped
    # NVIDIA GPU: uncomment (needs the NVIDIA Container Toolkit on the host).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hf-cache:
  config:
  collections:
  jobs:
  datasets:
  enrichers:
  evidence:
