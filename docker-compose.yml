services:
  core-ai-data-toolkit:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      # Empty unless set on the host, so limits saved from /admin persist.
      - MAX_MODELS=${MAX_MODELS:-}
      - MAX_MEMORY_GB=${MAX_MEMORY_GB:-}
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # Opens the API keys saved from /admin: a container has no credential store (env.example).
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY:-}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
    volumes:
      - hf-cache:/app/.cache/huggingface   # persisted model weights
      - data:/app/data                     # everything the service keeps (DATA_DIR): back this one up
      - envs:/opt/envs                     # job environments installed from /admin (AutoGluon): rebuilt, not backed up
      - ./data/images:/app/data/images:ro,Z  # images for /vision-language (Z: SELinux label, a no-op elsewhere)
    restart: unless-stopped
    # NVIDIA GPU: uncomment (needs the NVIDIA Container Toolkit on the host).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hf-cache:
  data:
  envs:
